server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: aegishealth-biometrics-backend
  
  # PostgreSQL Connection Configuration (Supports Supabase, Neon, or local Docker)
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/aegishealth}
    username: ${DATABASE_USER:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      pool-name: AegisHealthHikariCP

  # Hibernate & JPA ORM Settings
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  # Redis In-Memory Caching & Session Store
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

  cache:
    type: redis
    redis:
      time-to-live: 300000 # 5 minutes default TTL
      cache-null-values: false

# CORS Configuration for Next.js Frontend
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS
    allowed-headers: "*"
    allow-credentials: true

# Spring Boot Actuator Endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
